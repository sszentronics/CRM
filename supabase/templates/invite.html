<!doctype html>
<html>
  <body style="margin:0;padding:32px;background:#f7f5fc;font-family:Arial,Helvetica,sans-serif;color:#1b1030">
    <table role="presentation" width="100%" style="max-width:520px;margin:0 auto;background:#ffffff;border:1px solid #e4def2;border-radius:12px">
      <tr>
        <td style="background:#220b47;border-radius:12px 12px 0 0;padding:20px 28px;color:#ffffff;font-weight:bold;font-size:18px">
          Trading Labs
        </td>
      </tr>
      <tr>
        <td style="padding:28px">
          <p style="margin:0 0 12px;font-size:16px;font-weight:bold">Your CRM account is ready.</p>
          <p style="margin:0 0 24px;font-size:14px;line-height:20px;color:#3d3452">
            Set a password to sign in. The link works once and expires in 24 hours.
          </p>
          <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=invite&next=/reset-password"
             style="display:inline-block;background:#5b2ec9;color:#ffffff;text-decoration:none;font-weight:bold;font-size:14px;padding:12px 20px;border-radius:8px">
            Set my password
          </a>
          <p style="margin:24px 0 0;font-size:12px;color:#6b6385">
            If you were not expecting this, you can ignore this email.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
