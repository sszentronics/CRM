<title>Trading Labs Test Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: purple masthead with live progress, a scrolling row of tabs, then one checklist column of cards grouped into parts. */
:root {
  --bg: #f6f4fb;
  --surface: #ffffff;
  --ink: #1d1530;
  --muted: #6b6280;
  --line: #e4def0;
  --brand: #220b47;
  --brand-2: #4a2391;
  --brand-soft: #ece6f8;
  --on-brand: #ffffff;
  --on-brand-muted: #c9bce6;
  --pass: #137a4b;
  --pass-soft: #e2f5ec;
  --fail: #c0283b;
  --fail-soft: #fbe6e9;
  --skip: #8a6a00;
  --skip-soft: #fbf1d3;
  --info: #1d5fa8;
  --info-soft: #e3eefb;
  --focus: #7c4dff;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #120b1f; --surface: #1c1430; --ink: #efeaf9; --muted: #a79cc0; --line: #2f2548;
    --brand: #2a1056; --brand-2: #b79bff; --brand-soft: #2a1f44; --on-brand: #ffffff; --on-brand-muted: #c9bce6;
    --pass: #4fd394; --pass-soft: #12321f; --fail: #ff7a8a; --fail-soft: #3a1520; --skip: #f0c24a; --skip-soft: #3a2f10;
    --info: #8cbcf5; --info-soft: #14263d; --focus: #b79bff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #120b1f; --surface: #1c1430; --ink: #efeaf9; --muted: #a79cc0; --line: #2f2548;
  --brand: #2a1056; --brand-2: #b79bff; --brand-soft: #2a1f44; --on-brand: #ffffff; --on-brand-muted: #c9bce6;
  --pass: #4fd394; --pass-soft: #12321f; --fail: #ff7a8a; --fail-soft: #3a1520; --skip: #f0c24a; --skip-soft: #3a2f10;
  --info: #8cbcf5; --info-soft: #14263d; --focus: #b79bff; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1000px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.mast { background: var(--brand); color: var(--on-brand); }
header.mast .wrap { padding-block: 28px 22px; display: grid; gap: 18px; }
.mast-top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; justify-content: space-between; }
.mast h1 { font-family: var(--display); font-weight: 800; font-size: clamp(28px, 5vw, 40px); line-height: 1.05; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.mast p { margin: 6px 0 0; color: var(--on-brand-muted); max-width: 62ch; }
.tl-mark { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; background: #ffffff1f; font-family: var(--display); font-weight: 800; font-size: 17px; margin-bottom: 12px; letter-spacing: -0.02em; }
.tally { display: flex; flex-wrap: wrap; gap: 8px; }
.tally span { font-variant-numeric: tabular-nums; background: #ffffff14; border: 1px solid #ffffff26; border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.tally b { font-weight: 800; }
.tally .p b { color: #7ff0b5; } .tally .f b { color: #ffadb8; } .tally .s b { color: #ffe08a; }
.bar { height: 10px; border-radius: 999px; background: #ffffff1f; overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; transition: width .4s ease; }
.bar .bp { background: #4fd394; } .bar .bf { background: #ff7a8a; } .bar .bs { background: #f0c24a; }
.sync { font-size: 12.5px; color: var(--on-brand-muted); }
nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
nav.tabs .wrap { display: flex; gap: 6px; overflow-x: auto; padding-block: 10px; scrollbar-width: thin; }
.tab { flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 7px 14px; font: 600 14px var(--body); cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
.tab .n { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted); font-weight: 700; }
.tab[aria-selected="true"] { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
.tab[aria-selected="true"] .n { color: var(--on-brand-muted); }
.tab .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--fail); }
.tab.sep { margin-left: 8px; }
main .wrap { padding-block: 22px 60px; display: grid; gap: 18px; }
.section-head { display: grid; gap: 10px; }
.section-head h2 { font-family: var(--display); font-weight: 800; font-size: 26px; margin: 0; letter-spacing: -0.01em; }
.section-head p { margin: 0; color: var(--muted); max-width: 72ch; }
.who { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; }
.who code { font-family: var(--mono); font-size: 13px; background: var(--brand-soft); color: var(--ink); padding: 2px 8px; border-radius: 6px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13.5px; color: var(--muted); }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 5px 10px; font: 600 13px var(--body); cursor: pointer; }
.chip[aria-pressed="true"] { border-color: var(--brand-2); color: var(--brand-2); background: var(--brand-soft); }
.list { display: grid; gap: 10px; }
.part { font-family: var(--display); font-weight: 700; font-size: 18px; margin: 14px 0 2px; display: flex; gap: 10px; align-items: baseline; }
.part small { font-family: var(--body); font-size: 13px; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; }
.card.pass { border-left: 5px solid var(--pass); }
.card.fail { border-left: 5px solid var(--fail); }
.card.skip { border-left: 5px solid var(--skip); }
.num { font-family: var(--mono); font-size: 12.5px; color: var(--muted); padding-top: 3px; min-width: 2.8em; }
.body { min-width: 0; display: grid; gap: 8px; }
.card h3 { margin: 0; font-size: 16px; font-weight: 700; line-height: 1.35; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.badge.use { font-family: var(--mono); font-weight: 500; color: var(--ink); background: var(--brand-soft); border-color: transparent; }
.badge.block { color: var(--fail); border-color: color-mix(in srgb, var(--fail) 35%, transparent); }
.badge.wait { color: var(--skip); border-color: color-mix(in srgb, var(--skip) 40%, transparent); }
.badge.key { color: var(--brand-2); border-color: color-mix(in srgb, var(--brand-2) 40%, transparent); }
.card ol { margin: 0; padding-left: 20px; display: grid; gap: 2px; }
.card .expect { background: var(--brand-soft); border-radius: 8px; padding: 8px 10px; font-size: 14px; }
.card .expect strong { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--brand-2); display: block; margin-bottom: 2px; }
.card .expect ul { margin: 2px 0 0; padding-left: 18px; display: grid; gap: 2px; }
.card .tip { font-size: 13px; color: var(--muted); }
.card .from { font-size: 12.5px; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 6px 12px; font: 600 14px var(--body); cursor: pointer; }
.btn:hover { border-color: var(--brand-2); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn.on-pass { background: var(--pass-soft); border-color: var(--pass); color: var(--pass); }
.btn.on-fail { background: var(--fail-soft); border-color: var(--fail); color: var(--fail); }
.btn.on-skip { background: var(--skip-soft); border-color: var(--skip); color: var(--skip); }
.btn.clear { border-style: dashed; color: var(--muted); }
.stamp { font-size: 12.5px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.stamp img { width: 18px; height: 18px; border-radius: 50%; }
textarea { width: 100%; min-height: 64px; resize: vertical; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: 14px/1.45 var(--body); background: var(--bg); color: var(--ink); }
.saved { font-size: 12px; color: var(--muted); }
button:focus-visible, textarea:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.note-banner { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; font-size: 14px; display: grid; gap: 6px; }
.note-banner.info { border-color: color-mix(in srgb, var(--info) 40%, transparent); background: var(--info-soft); }
.note-banner ul { margin: 0; padding-left: 18px; display: grid; gap: 3px; }
.logins { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.logins table { border-collapse: collapse; width: 100%; min-width: 560px; font-size: 14px; }
.logins th, .logins td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.logins th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.logins td.m { font-family: var(--mono); font-size: 13px; white-space: nowrap; }
.logins tr:last-child td { border-bottom: 0; }
.empty { color: var(--muted); padding: 18px; text-align: center; border: 1px dashed var(--line); border-radius: 12px; }
@media (max-width: 520px) { .card { grid-template-columns: 1fr; } .num { padding-top: 0; } }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

<header class="mast">
  <div class="wrap">
    <div class="mast-top">
      <div>
        <div class="tl-mark" aria-hidden="true">TL</div>
        <h1>Trading Labs Test Board</h1>
        <p>A full check of the CRM: every screen, every rule and every type of account. Pick a tab, sign in with the account shown on each card, follow the steps, and mark what happened. Everyone on the team sees the same board, live.</p>
      </div>
      <div class="tally" id="tally" aria-live="polite"></div>
    </div>
    <div class="bar" id="bar" aria-hidden="true"><i class="bp"></i><i class="bf"></i><i class="bs"></i></div>
    <div class="sync" id="sync">Connecting to the shared board…</div>
  </div>
</header>

<nav class="tabs" aria-label="Sections"><div class="wrap" id="tabs" role="tablist"></div></nav>

<main><div class="wrap" id="main"></div></main>

<script>
const PW = "TLtest@2026";
const T = (id, part, use, t, steps, expect, o = {}) => ({ id, part, use, t, steps, expect, ...o });

const GROUPS = [
  {
    id: "start", label: "Before you start", account: null,
    intro: "Do these once, before anyone starts testing. They set up a clean copy of the CRM with test accounts and no real client data, and give the team what it needs for the deeper tests.",
    tests: [
      T("S1", "Set up", "Main computer", "Load the clean test data", ["Open Docker Desktop and wait until it says “Engine running”.", "Double-click Desktop\\CRM\\scripts\\reset-test-data.bat.", "Wait for the window to show the list of logins."], "The window ends with “Test data seeded: 24 people, 4 teams, 2 brokers, 0 leads.”", { key: 1 }),
      T("S2", "Set up", "Main computer", "Open the CRM for the whole team", ["Double-click Desktop\\CRM\\scripts\\start-testing.bat.", "Copy the web address it shows (it starts with http:// and ends in :3200).", "Send that address to everyone on the same Wi-Fi.", "Keep the window open and the computer awake for the whole session."], "Each tester can open the address on their own laptop and sees the Trading Labs sign-in page.", { key: 1 }),
      T("S3", "Set up", "Main computer", "Find the test email inbox", ["Take the CRM address and change :3200 at the end to :54324.", "Open it in a browser."], "A page called Mailpit opens. All emails the CRM sends during testing (password resets, invites) land here instead of real inboxes."),
      T("S4", "Set up", "Everyone", "Split the work", ["Give each tester one or two tabs on this board.", "For the Full journey tab, book 30 minutes when one person is on each account at the same time.", "Agree that whoever finds a problem marks it here with a note good enough for someone else to repeat it."], "Everyone knows which account they are signing in with and which tab they own."),
      T("S5", "Set up", "Owner and Admin testers", "Get the phone codes ready", ["The Owner tester and the Admin tester each install Google Authenticator or Microsoft Authenticator on their phone."], "Both have the app ready before they first sign in. Without it they cannot get past the sign-in page."),
      T("S6", "Test data", "owner@tl.test", "Load 30 practice leads", ["Sign in as the Owner, open Add leads, then the import tab, and download the template.", "Fill 30 rows with made-up names and numbers (for example 0300 1110001 to 0300 1110030), spread across the sources Facebook, Instagram, TikTok, PR, Referral and Walk-in.", "Import the file."], "30 new leads appear in All leads, all with the status New and no team. The sharing-out tests on the Admin tab need these.", { key: 1 }),
      T("S7", "Test data", "Main computer or a TV", "Keep the Arena on a big screen", ["On a spare screen, sign in as any account and open Arena.", "Leave it open all session."], "Everyone can glance at it to see live changes when deposits are confirmed."),
      T("S8", "Test data", "owner@tl.test", "Make waiting-time tests faster (optional)", ["In Settings, lower “referral deadline hours” from 24 to 1 and “max call tries” from 5 to 3.", "Write the original values in the note below so they get put back."], "Tests marked “Needs waiting time” become quicker. Put the settings back to 24 and 5 at the end of testing.", { wait: 1 }),
    ],
  },
  {
    id: "everyone", label: "Every account", account: "Repeat with each account type and say which in your note",
    intro: "These checks apply to all five types of account. Run each one with the Owner, the Admin, a Team Lead, an Agent and the Analyst, and write which accounts you used in the note.",
    tests: [
      T("E1", "Signing in", "Each account", "Signing in opens the right home page", ["Sign in with the account's email and the test password."], ["Owner opens on Dashboard.", "Admin opens on Work queue.", "Team Lead opens on Team.", "Agent opens on Today's calls.", "Analyst opens on Sessions."], { key: 1 }),
      T("E2", "Signing in", "Each account", "A wrong password is refused", ["Sign out.", "Sign in with the right email and a wrong password.", "Try an email that doesn't exist."], "Both show an error and you stay on the sign-in page. The message does not say whether the email exists.", { block: 1 }),
      T("E3", "Signing in", "Any account", "Signed-out people can't open inside pages", ["Sign out.", "Paste the address of an inside page (for example the CRM address ending in /today) and press Enter."], "You are sent to the sign-in page. After signing in you land on the page you asked for, if your account may open it.", { block: 1 }),
      T("E4", "Signing in", "Any account", "There is no way to sign up", ["Look around the sign-in page for a “Create account” or “Sign up” link."], "There is none. New people can only be added by the Owner or Admin.", { block: 1 }),
      T("E5", "Signing in", "Any account", "Forgot password works end to end", ["On the sign-in page click “Forgot password” and enter the email.", "Open the test inbox (see S3), open the email and follow the link.", "Set a new password and sign in with it."], "The email arrives within a minute, the link works once, and the new password lets you in.", { tip: "Set the password back to TLtest@2026 afterwards so others can still use this account." }),
      T("E6", "My profile", "Each account", "Profile photo", ["Open your profile from the top right.", "Upload a photo.", "Look at the top bar, and at the Arena if you are a Team Lead."], "The photo shows straight away in the top bar. A Team Lead's photo also shows on their team's Arena lane."),
      T("E7", "My profile", "Each account", "Change your password, with the length rule", ["In your profile, try a new password of 9 characters.", "Then use one of at least 10 characters.", "Sign out and in with the new one, then change it back to TLtest@2026."], "9 characters is refused with a clear message. 10 or more is accepted.", { block: 1 }),
      T("E8", "My profile", "Each account", "You can only change your own photo and password", ["On your profile, look for ways to change your own name, email, phone or role."], "Those are shown but can't be changed by you. Only the Owner (or the Admin, for Team Leads and agents) changes them.", { block: 1 }),
      T("E9", "Menu and access", "Each account", "The menu only shows what this person should use", ["Look at the purple menu on the left."], ["Owner: everything, including Brokers, Targets, Settings, Audit log and Styleguide.", "Admin: everything except Dashboard, Brokers, Targets, Settings, Audit log and Styleguide.", "Team Lead: Team, Today's calls, Pipeline, Assign leads, Arena, Leaderboard.", "Agent: Today's calls, Pipeline, Arena, Leaderboard.", "Analyst: Sessions, Arena, Leaderboard."], { key: 1 }),
      T("E10", "Menu and access", "Agent, then Analyst, then Team Lead", "Typing a blocked page address shows “No access”", ["Replace the end of the address with each of these and press Enter: /users, /deposits, /documents, /distribution, /exports, /reports, /settings, /audit-log."], "Each one shows a “No access” page with nothing from the real page visible.", { block: 1, key: 1 }),
      T("E11", "Menu and access", "Any account", "Unknown pages", ["Add /something-made-up to the end of the address."], "A purple and white “Page not found” page appears, with a way back home."),
      T("E12", "Notifications", "Any account, with a teammate", "The bell updates by itself", ["Keep your page open.", "Ask a teammate to do something that notifies you (the Admin assigns you a lead, or a Team Lead leaves you a note)."], "The red number on the bell goes up within a few seconds without you refreshing the page."),
      T("E13", "Notifications", "Any account", "Notifications page", ["Open Notifications from the bell.", "Switch between All and Unread.", "Click one notification.", "Click “Mark all as read”."], "Clicking opens the exact lead or deposit it talks about and marks it as read. Mark all as read clears the bell's number."),
      T("E14", "Search", "Each account", "Search finds only what you may see", ["In the top search bar type 2 letters, then 3 letters of a lead's name.", "Search part of a phone number.", "Press Enter to open the full results page."], "Nothing shows at 2 letters. From 3 letters, only leads this account may work on appear. Enter opens a results page.", { key: 1 }),
      T("E15", "Search", "Agent or Team Lead", "Search can't be used to peek at other teams", ["Search the full phone number of a lead that belongs to another team or another agent."], "It says “Already in the system” and shows no name, owner or link.", { block: 1 }),
      T("E16", "Arena and boards", "Each account", "The Arena opens for everyone", ["Click Arena in the menu.", "Click “Back to the CRM” at the top."], "A dark purple page opens with team lanes, top agents, a live feed and a month summary. No client names anywhere. “Back to the CRM” returns to this account's home page."),
    ],
  },
  {
    id: "owner", label: "Owner", account: "owner@tl.test",
    intro: "The Owner (called Superadmin inside the app) sets up the company: people, teams, brokers, targets, prizes and settings. The Owner sees everything and is the only one who can read the audit log.",
    tests: [
      T("O1", "Signing in safely", "owner@tl.test", "First sign-in sets up a phone code", ["Sign in with owner@tl.test.", "Scan the square code with the phone app.", "Type the 6-digit number the app shows.", "Sign out and sign in again."], "The second time, after the password, it asks for a fresh 6-digit number before letting you in.", { key: 1, tip: "Whoever holds this phone is the only one who can sign in as Owner." }),
      T("O2", "Signing in safely", "owner@tl.test", "A wrong or old code is refused", ["At the code step, type 123456.", "Then type a code that has just expired (wait for the app to show a new one and use the old one)."], "Both are refused. You are not let in.", { block: 1 }),
      T("O3", "Signing in safely", "owner@tl.test", "Signed out when left idle", ["Sign in and leave the page untouched for 30 minutes (or lower “idle sign-out minutes” in Settings to test faster)."], "You are signed out automatically and sent to the sign-in page.", { wait: 1 }),
      T("O4", "People and teams", "owner@tl.test", "Add one of each type of person", ["Open Users and teams.", "Add an Admin, an Analyst and an Agent for Team B. Use emails nobody has used yet, like admin9@tl.test.", "Add a Team Lead the same way (role Team Lead).", "Check the test inbox for their invite emails."], "All four appear in the People list straight after saving, with the right role and team. Each gets an invite email with a link to set a password. If something is wrong (for example the email or phone is already used) a red message appears inside the panel and NO invite email is sent."),
      T("O5", "People and teams", "owner@tl.test", "Create a fifth team", ["Add a new person as Team Lead, then add a team called “Team E” with that person as lead.", "Try another team called “team e” (same name, different capitals).", "Try a team name of one letter."], "Team E is created. The duplicate name and the one-letter name are both refused.", { block: 1 }),
      T("O6", "People and teams", "owner@tl.test", "Phone number rules for staff", ["Edit A2 and give a phone of 03001234567. Save.", "Edit A2 again and try 12345.", "Edit A3 and give the same number as A2 (0300 1234567).", "Edit A3 and give a number from another country, for example +44 7911 123456."], "The Pakistani number and the +44 number save. 12345 is refused with a red message under the Phone box. The repeated number is refused with the red message “That phone number already belongs to another person.” under the Phone box and stays open.", { block: 1 }),
      T("O7", "People and teams", "owner@tl.test + a Team Lead", "Switching off an agent returns their leads", ["Make sure A3 has a few open leads.", "Switch A3 off.", "Read the message that appears, then sign in as A1."], "The message says how many leads were returned. A1 sees them in the unassigned list. A3 can no longer sign in and sees “Account disabled, contact your Admin”.", { key: 1 }),
      T("O8", "People and teams", "owner@tl.test", "Someone already signed in gets thrown out", ["Have a tester sign in as D4 and keep the page open.", "Switch D4 off.", "D4 clicks anything."], "D4 is signed out straight away and cannot get back in. Switch D4 back on afterwards.", { block: 1 }),
      T("O9", "People and teams", "owner@tl.test", "A Team Lead can't be removed by accident", ["Try to switch off D1 (who leads Team D): click Disable, then Disable account.", "Try to change D1's role to Agent: click Edit, choose Agent and a team, Save."], "Both are refused and stay open with a red message, “This person leads a team. Change the Team Lead first.” Nothing changes until someone else is made Team D's lead.", { block: 1 }),
      T("O10", "People and teams", "owner@tl.test", "Change a team's lead", ["Make D2 the Team Lead of Team D."], "D2 becomes the lead and D1 is no longer lead. Team D still has exactly one lead. Change it back afterwards."),
      T("O11", "People and teams", "owner@tl.test", "Move an agent and change a team colour", ["Move B4 to Team C.", "Change Team C's colour."], "B4 now shows in Team C. The new colour shows on Users and teams and on the Arena lane. Put both back afterwards."),
      T("O12", "People and teams", "owner@tl.test", "Reset someone else's password", ["Use “Reset password” on C3.", "Open the test inbox."], "A reset email for C3 is there and the link works."),
      T("O13", "People and teams", "owner@tl.test", "Find people quickly", ["In the people list, search for “B” and filter by role Agent."], "Only matching agents show."),
      T("O14", "Brokers", "owner@tl.test", "Add brokers for each market", ["Open Brokers.", "Add “Test Broker 3” with market Other.", "Open its document checklist."], "It is added and switched on. A new broker starts with six items ticked: CNIC front, CNIC back, photo, signature, proof of income, bank proof. Proof of address, Zakat declaration and nominee CNIC are there but unticked."),

try { const h = location.hash.slice(1); if (h === "problems" || GROUPS.some((g) => g.id === h)) current = h; } catch (e) {}
try { const f = localStorage.getItem("tl-filter"); if (f) filter = f; } catch (e) {}

const $ = (s, el = document) => el.querySelector(s);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
const fmtTime = (iso) => { try { return new Date(iso).toLocaleString(undefined, { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }); } catch (e) { return ""; } };

function counts(tests) {
  let p = 0, f = 0, s = 0;
  for (const t of tests) { const r = results[t.id]?.status; if (r === "pass") p++; else if (r === "fail") f++; else if (r === "skip") s++; }
  return { p, f, s, total: tests.length, left: tests.length - p - f - s };
}

function renderTally() {
  const c = counts(TESTS);
  const t = $("#tally"); t.replaceChildren();
  const add = (cls, n, label) => { const s = el("span", cls); s.append(el("b", null, String(n)), " " + label); t.append(s); };
  add("p", c.p, "worked"); add("f", c.f, "problems"); add("s", c.s, "skipped"); add("", c.left, "of " + c.total + " not tested yet");
  const bar = $("#bar").children;
  bar[0].style.width = (100 * c.p / c.total) + "%";
  bar[1].style.width = (100 * c.f / c.total) + "%";
  bar[2].style.width = (100 * c.s / c.total) + "%";
}

function tabButton(id, label, c, extraCls) {
  const b = el("button", "tab" + (extraCls ? " " + extraCls : ""));
  b.type = "button"; b.setAttribute("role", "tab"); b.id = "tab-" + id;
  b.setAttribute("aria-selected", String(id === current));
  b.append(label);
  if (c && c.f) { const d = el("span", "dot"); d.title = c.f + " problem(s)"; b.append(d); }
  if (c) b.append(el("span", "n", (c.p + c.f + c.s) + "/" + c.total));
  b.addEventListener("click", () => { current = id; try { history.replaceState(null, "", "#" + id); } catch (e) {} renderTabs(); renderMain(); window.scrollTo({ top: 0 }); });
  return b;
}

function renderTabs() {
  const box = $("#tabs"); box.replaceChildren();
  for (const g of GROUPS) box.append(tabButton(g.id, g.label, counts(g.tests), g.kind === "decision" ? "sep" : ""));
  const fails = Object.values(results).filter((r) => r.status === "fail").length;
  const pb = tabButton("problems", "Problems found", null, "sep");
  pb.append(el("span", "n", String(fails)));
  box.append(pb);
}

function renderMain() {
  const main = $("#main"); main.replaceChildren();
  if (current === "problems") return renderProblems(main);
  const g = GROUPS.find((x) => x.id === current);
  const isDecision = g.kind === "decision";
  const head = el("div", "section-head");
  head.append(el("h2", null, g.label), el("p", null, g.intro));
  if (g.account) {
    const w = el("div", "who"); w.append("Sign in as ", el("code", null, g.account), " · password ", el("code", null, PW));
    head.append(w);
  }
  main.append(head);

  if (g.id === "start") {
    const box = el("div", "logins"); const tb = el("table");
    const hr = el("tr"); ["Name", "Email", "What they are"].forEach((h) => hr.append(el("th", null, h)));
    const thead = el("thead"); thead.append(hr); tb.append(thead);
    const tbody = el("tbody");
    for (const [n, e, r] of LOGINS) { const tr = el("tr"); tr.append(el("td", null, n), el("td", "m", e), el("td", null, r)); tbody.append(tr); }
    tb.append(tbody); box.append(tb); main.append(box);
    const how = el("div", "note-banner info");
    how.append(el("strong", null, "How to read a card"));
    const ul = el("ul");
    ["The grey box under the title says which account to sign in with.", "“Key test” means test this first: if it fails, the CRM isn't ready.", "“Should be refused” means the right result is that the CRM says no.", "“Needs waiting time” means the result only shows after minutes or hours.", "Problem: always add a note saying what you did, which account, and what you saw."].forEach((x) => ul.append(el("li", null, x)));
    how.append(ul); main.append(how);
    const nb = el("div", "note-banner");
    nb.append(el("strong", null, "Not built yet, so don't test these"));
    const ul2 = el("ul"); NOT_BUILT.forEach((x) => ul2.append(el("li", null, x))); nb.append(ul2);
    main.append(nb);
  }

  const fl = el("div", "filters"); fl.append("Show:");
  const opts = isDecision ? [["all", "All"], ["todo", "Not answered"], ["fail", "Change it"]] : [["all", "All"], ["key", "Key tests"], ["todo", "Not tested yet"], ["fail", "Problems"]];
  for (const [k, label] of opts) {
    const b = el("button", "chip", label); b.type = "button"; b.setAttribute("aria-pressed", String(filter === k));
    b.addEventListener("click", () => { filter = k; try { localStorage.setItem("tl-filter", k); } catch (e) {} renderMain(); });
    fl.append(b);
  }
  main.append(fl);

  const list = el("div", "list");
  const shown = g.tests.filter((t) => filter === "all" || (filter === "key" && t.key) || (filter === "todo" && !results[t.id]?.status) || (filter === "fail" && results[t.id]?.status === "fail"));
  if (!shown.length) list.append(el("div", "empty", filter === "fail" ? "Nothing marked as a problem in this section." : filter === "key" ? "No key tests in this section." : "Everything in this section has been marked."));
  let part = null;
  for (const t of shown) {
    if (t.part && t.part !== part) {
      part = t.part;
      const inPart = g.tests.filter((x) => x.part === part);
      const c = counts(inPart);
      const h = el("h3", "part", part); h.append(el("small", null, (c.p + c.f + c.s) + " of " + c.total + " done"));
      list.append(h);
    }
    list.append(card(t, isDecision));
  }
  main.append(list);
  refreshStamps();
}

  const list = el("div", "list");
  const ids = Object.entries(results).filter(([, r]) => r.status === "fail").map(([id]) => id).filter((id) => BY_ID[id]);
  if (!ids.length) list.append(el("div", "empty", "No problems reported yet."));
  for (const id of ids) {
    const t = BY_ID[id];
    const c = card(t, t.group.kind === "decision");
    $(".body", c).prepend(el("div", "from", t.group.label + (t.part ? " · " + t.part : "")));
    list.append(c);
  }
  main.append(list);
  refreshStamps();
}

function card(t, isDecision) {
  const c = el("article", "card"); c.id = "card-" + t.id;
  c.append(el("div", "num", t.id));
  const b = el("div", "body");
  b.append(el("h3", null, t.t));
  const meta = el("div", "meta");
  if (t.use) meta.append(el("span", "badge use", t.use));
  if (t.key) meta.append(el("span", "badge key", "Key test"));
  if (t.block) meta.append(el("span", "badge block", "Should be refused"));
  if (t.wait) meta.append(el("span", "badge wait", "Needs waiting time"));
  if (meta.childElementCount) b.append(meta);
  if (t.steps && t.steps.length) { const ol = el("ol"); t.steps.forEach((s) => ol.append(el("li", null, s))); b.append(ol); }
  const ex = el("div", "expect");
  ex.append(el("strong", null, isDecision ? "How it works now" : "What should happen"));
  if (Array.isArray(t.expect)) { const ul = el("ul"); t.expect.forEach((x) => ul.append(el("li", null, x))); ex.append(ul); }
  else ex.append(t.expect);
  b.append(ex);
  if (t.tip) b.append(el("div", "tip", "Tip: " + t.tip));
  const act = el("div", "actions");
  const labels = isDecision ? [["pass", "Agree"], ["fail", "Change it"], ["skip", "Later"]] : [["pass", "Worked"], ["fail", "Problem"], ["skip", "Skip"]];
  for (const [k, label] of labels) {
    const btn = el("button", "btn", label); btn.type = "button"; btn.dataset.k = k;
    btn.addEventListener("click", () => setStatus(t.id, results[t.id]?.status === k ? null : k));
    act.append(btn);
  }
  const noteBtn = el("button", "btn clear", "Add note"); noteBtn.type = "button"; noteBtn.dataset.role = "note";
  noteBtn.addEventListener("click", () => { const ta = $("textarea", c); ta.hidden = false; $(".saved", c).hidden = false; noteBtn.hidden = true; ta.focus(); });
  act.append(noteBtn, el("span", "stamp"));
  b.append(act);
  const ta = el("textarea"); ta.id = "note-" + t.id;
  ta.placeholder = isDecision ? "What should change? Be specific." : "What happened? Which account did you use? Write enough that someone else can repeat it.";
  ta.setAttribute("aria-label", "Note for " + t.id);
  ta.hidden = true;
  let timer = null;
  ta.addEventListener("input", () => { clearTimeout(timer); $(".saved", c).textContent = "Saving…"; timer = setTimeout(() => saveNote(t.id, ta.value), 900); });
  ta.addEventListener("blur", () => { clearTimeout(timer); if ((results[t.id]?.note || "") !== ta.value) saveNote(t.id, ta.value); });
  const saved = el("div", "saved", ""); saved.hidden = true;
  b.append(ta, saved);
  c.append(b);
  paintCard(t.id, c);
  return c;
}

function paintCard(id, c = document.getElementById("card-" + id)) {
  if (!c) return;
  const r = results[id] || {};
  c.classList.remove("pass", "fail", "skip");
  if (r.status) c.classList.add(r.status);
  c.querySelectorAll(".btn[data-k]").forEach((b) => { b.className = "btn" + (b.dataset.k === r.status ? " on-" + r.status : ""); b.setAttribute("aria-pressed", String(b.dataset.k === r.status)); b.disabled = !canWrite; });
  const ta = $("textarea", c);
  if (document.activeElement !== ta) {
    ta.value = r.note || "";
    const show = !!(r.note || r.status === "fail");
    ta.hidden = !show; $(".saved", c).hidden = !show;
    $(".saved", c).textContent = r.note ? "Saved" : "";
  }
  ta.readOnly = !canWrite;
  $('[data-role="note"]', c).hidden = !ta.hidden || !canWrite;
}

async function refreshStamps() {
  const ids = [...new Set(Object.values(results).map((r) => r.by).filter(Boolean))];
  let ps = {};
  if (user && ids.length) { try { ps = await user.profiles(ids); } catch (e) {} }
  for (const [id, r] of Object.entries(results)) {
    const c = document.getElementById("card-" + id); if (!c) continue;
    const s = $(".stamp", c); s.replaceChildren();
    if (!r.status && !r.note) continue;
    const p = r.by ? ps[r.by] : null;
    if (p && p.avatarUrl) { const img = el("img"); img.alt = ""; img.src = p.avatarUrl; s.append(img); }
    const who = p ? (p.isMe ? "you" : (p.name || "a teammate")) : "a teammate";
    s.append(el("span", null, "by " + who + (r.at ? " · " + fmtTime(r.at) : "")));
  }
}

async function write(id, patch) {
  const prev = results[id] || {};
  const next = { status: prev.status || null, note: prev.note || "", ...patch, by: myId, at: new Date().toISOString() };
  results[id] = next;
  paintCard(id); renderTally(); renderTabs(); refreshStamps();
  if (!db) return;
  try { await db.doc("results/" + id).set(next); setSync("Saved. Everyone sees the same board."); }
  catch (e) {
    if (e && e.code === "invalid_argument") { canWrite = false; setSync("You can look at this board but not change it. Ask the owner for Contributor access."); Object.keys(BY_ID).forEach((k) => paintCard(k)); }
    else setSync("Couldn't save just now. Check your connection and try again.");
  }
}
function setStatus(id, status) { if (canWrite) write(id, { status }); }
function saveNote(id, note) { if (canWrite) { write(id, { note }); const c = document.getElementById("card-" + id); if (c) $(".saved", c).textContent = "Saved"; } }
function setSync(msg) { $("#sync").textContent = msg; }

renderTally(); renderTabs(); renderMain();

(async () => {
  try {
    [db, user] = await Promise.all([window.claude?.use?.("db") ?? null, window.claude?.use?.("user") ?? null]);
  } catch (e) { db = null; }
  if (!db) { setSync("This copy can't save to the shared board, so your marks only last until you close the page."); return; }
  try { myId = user ? await user.id() : null; } catch (e) {}
  try { const w = user ? await user.can("data.write") : null; if (w === false) { canWrite = false; Object.keys(BY_ID).forEach((k) => paintCard(k)); } } catch (e) {}
  db.collection("results").onSnapshot((snap) => {
    for (const k of Object.keys(results)) delete results[k];
    for (const d of snap.docs) { const v = d.data(); if (v) results[d.id] = v; }
    if (current === "problems" && !(document.activeElement && document.activeElement.tagName === "TEXTAREA")) renderMain(); else { Object.keys(BY_ID).forEach((k) => paintCard(k)); refreshStamps(); }
    renderTally(); renderTabs();
    const done = Object.values(results).filter((r) => r.status).length;
    setSync(canWrite ? (done ? "Live. Marks from everyone appear here as they happen." : "Live. Nothing marked yet. Start with “Before you start”.") : "You can look at this board but not change it. Ask the owner for Contributor access.");
  }, () => setSync("Lost the live connection. Reload the page to reconnect."));
})();
</script>
